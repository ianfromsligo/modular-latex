template: revtex-pra
metadata:
  title: Full Classification of Full State Revivals on Separable Quantum Walks on Tori
  authors:
  - name: Ian Craig
    email: ian.craig@atu.ie
    affiliation: Atlantic Technological University, Sligo, Ireland
  - name: Michael McGetterick
    affiliation: University of Galway, Galway, Ireland
  abstract: |
    We classify full-state revivals for separable discrete-time
    quantum walks on $k \times m$ toroidal lattices, for $k, m \le 16$
    and revival periods $N \le 60$. We prove that every
    $k \in \{2, 3, 4, 5, 6, 8, 10\}$ admits a non-trivial 1D revival,
    and that no other $k \le 16$ admits one within the search bound.
    The 2D case factorises as $U_{k \times m} = U_k \otimes U_m$, so a
    torus revives whenever both axes revive at a common period. We find
    one 1D revival not tabulated by Dukes, at $k = 2$, $N = 60$,
    $\rho \approx 0.0146$, $\delta = 2\pi/3$, which generates new
    revival families on $2 \times 5$ and $2 \times 10$ tori. The
    classification contains $24$ tori, $30$ periods, and $4{,}773$
    canonical parameter sets. A striking feature emerges: only $23\%$
    of these have zero phase on both axes. In 1D the phase parameter
    $\delta$ affects only the eigenvectors; in 2D it becomes a
    selection mechanism, with $64\%$ of revivals requiring unequal
    phases along the two axes. The longest period, $N = 60$, occurs on
    the smallest prime torus $5 \times 5$. We state a conjecture that no
    $k \notin \{2, 3, 4, 5, 6, 8, 10\}$ admits a 1D revival at any
    period, and sketch a cyclotomic-field approach to the proof.

