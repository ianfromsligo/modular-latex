template: revtex-pra
metadata:
  title: Complete Classification of Full State Revivals on Separable Quantum Walks on Tori
  authors:
  - name: Ian Craig
    email: ian.craig@atu.ie
    affiliation: Atlantic Technological University, Sligo, Ireland
  - name: Michael McGetterick
    affiliation: University of Galway, Galway, Ireland
  abstract: 'We present a complete classification of full-state revivals for separable discrete-time quantum walks on $k \times m$ toroidal lattices. To achieve this, we first prove that a 2D torus exhibits full-state revivals if and only if both spatial dimensions $k,m \in \{2, 3, 4, 5, 6, 8, 10\}$ and their respective revival period sets share a common element, $N_k \cap N_m \neq \emptyset$ (the revival holding up to a global phase). We base our methodology on the results of the work of Dukes \cite{Dukes2014} on 1D cycles for a general coin parameterised by 
a reflection parameter $\rho$ and a phase parameter $\delta$, We develop this concept for a four parameter general coin for the $k \times m$ tori quantum walk.  We report the computational search that enumerates all full-state revivals for $k \times m$ toroidal lattices with dimensions in the above revival set. In this process we note three phenomena occurring with the 2D lattices. Multi-period revivals on the same torus size, where full-state revivals occur across multiple distinct step counts depending on the coin parameters (e.g. the $3 \times 3$ torus); 
mixed-$\rho$ parameters for the same torus, resultng in revivals; 
and mixed-$\delta$ asymmetry, where revivals occur under coin phase parameters along the two axes 
($\delta_x \neq \delta_y$). Interestingly, the longest revival period, $N = 60$, occurs on the small torus, $5 \times 5$, The output of this paper provides a full classification of full-state revivals given the four parameters of the coin and may find applications in quantum memory and in structures such as frequency dividers and counters.

    '
