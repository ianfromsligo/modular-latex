template: revtex-pra
metadata:
  title: Full Classification of Full State Revivals on Separable Quantum Walks on Tori
  authors:
  - name: Ian Craig
    email: ian.craig@atu.ie
    affiliation: Atlantic Technological University, Sligo, Ireland
  - name: Michael McGetterick
    affiliation: University of Galway, Galway, Ireland
  abstract: |
    We present a full classification of full-state revivals for separable
    discrete-time quantum walks on $k \times m$ toroidal lattices with
    $k, m \le 10$. We prove that a $2$D torus exhibits full-state revivals
    whenever both spatial dimensions satisfy $k, m \in \{2, 3, 4, 5, 6, 8,
    10\}$ and their respective revival period sets share a common element,
    $\mathcal{N}_k \cap \mathcal{N}_m \neq \emptyset$. Our methodology
    builds on Dukes' results \cite{Dukes2014} on $1$D cycles for a general
    coin with reflection parameter $\rho$ and phase parameter $\delta$. We
    extend this framework to a separable four-parameter coin on the
    $k \times m$ torus, and prove non-existence of $1$D revivals for
    $k = 7$ and $k = 9$ at any step count for rational $\rho$. Our
    exhaustive computational search over $k, m \le 16$ finds no revival
    outside the class above. The reduced classification contains $4773$
    parameter sets across $24$ tori and $30$ distinct revival periods.
    Notably, the longest revival period, $N = 60$, occurs on the
    $5 \times 5$ torus. This paper provides a full classification of
    full-state revivals given the four parameters of the separable coin
    and may find applications in quantum memory and in structures such as
    frequency dividers and counters.
  date: today
  bibliographystyle: apsrev4-2
  bibliography: docs/sep-coin-tori/references.bib
